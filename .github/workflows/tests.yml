name: Tests
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests_ha .github/scripts
      - run: ruff format --check custom_components tests_ha .github/scripts
      - run: python -m pytest -q --tb=short
